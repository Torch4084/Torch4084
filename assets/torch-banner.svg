<svg width="100%" height="auto" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#121820" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff4400" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0.5" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3300" />
      <stop offset="40%" stop-color="#ff7700" />
      <stop offset="80%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#fff2a8" />
    </linearGradient>

    <linearGradient id="torch-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="100%" stop-color="#161922" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="flame-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ff7700" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="798" height="198" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  <rect x="1" y="1" width="798" height="198" rx="12" fill="url(#grid)" />

  <!-- Window Header Bar -->
  <path d="M 1 13 C 1 6.37 6.37 1 13 1 L 787 1 C 793.63 1 799 6.37 799 13 L 799 36 L 1 36 Z" fill="#141922" fill-opacity="0.8" />
  <line x1="1" y1="36" x2="799" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="76" y="22" fill="#8b949e" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="500">torch@archlinux:~ (ctf-session)</text>

  <!-- Status indicator badge -->
  <circle cx="700" cy="18" r="4" fill="#22c55e" filter="url(#soft-glow)" />
  <text x="710" y="22" fill="#22c55e" font-family="'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1">ONLINE</text>

  <!-- Left Side: Flame Emblem Box -->
  <g transform="translate(36, 52)">
    <!-- Tech Frame -->
    <rect x="0" y="0" width="112" height="124" rx="10" fill="#090c10" stroke="#ff7700" stroke-width="1" stroke-opacity="0.25" />
    <path d="M 0 15 L 0 0 L 15 0" stroke="#ff7700" stroke-width="2" fill="none" stroke-opacity="0.8" />
    <path d="M 97 0 L 112 0 L 112 15" stroke="#ff7700" stroke-width="2" fill="none" stroke-opacity="0.8" />
    <path d="M 0 109 L 0 124 L 15 124" stroke="#ff7700" stroke-width="2" fill="none" stroke-opacity="0.8" />
    <path d="M 97 124 L 112 124 L 112 109" stroke="#ff7700" stroke-width="2" fill="none" stroke-opacity="0.8" />

    <!-- Cyber Torch Vector -->
    <!-- Handle -->
    <path d="M 49 68 L 63 68 L 59 106 L 53 106 Z" fill="url(#torch-body)" stroke="#ff7700" stroke-width="1" stroke-opacity="0.4" />
    <line x1="51" y1="80" x2="61" y2="80" stroke="#ff7700" stroke-width="1" stroke-opacity="0.5" />
    <line x1="52" y1="92" x2="60" y2="92" stroke="#ff7700" stroke-width="1" stroke-opacity="0.5" />

    <!-- Flame outer glow -->
    <path d="M 56 16 C 56 16, 69 32, 69 44 C 69 56, 61 66, 56 66 C 51 66, 43 56, 43 44 C 43 32, 56 16, 56 16 Z" fill="#ff5500" opacity="0.3" filter="url(#flame-glow)" />

    <!-- Flame main body -->
    <path d="M 56 20 C 56 20, 68 34, 68 45 C 68 56, 62 64, 56 64 C 50 64, 44 56, 44 45 C 44 34, 56 20, 56 20 Z" fill="url(#flame-grad)" />

    <!-- Flame inner core -->
    <path d="M 56 32 C 56 32, 63 42, 63 49 C 63 56, 59 60, 56 60 C 53 60, 49 56, 49 49 C 49 42, 56 32, 56 32 Z" fill="#fff9d6" />

    <!-- Cyber text label -->
    <text x="56" y="118" text-anchor="middle" fill="#ff7700" font-family="'Fira Code', monospace" font-size="9" font-weight="700" letter-spacing="1.5">TORCH</text>
  </g>

  <!-- Right Side: Terminal Content -->
  <g transform="translate(172, 62)">
    <!-- Command line -->
    <text x="0" y="14" fill="#ff7700" font-family="'Fira Code', monospace" font-size="13" font-weight="700">&#x276F;</text>
    <text x="18" y="14" fill="#f0f6fc" font-family="'Fira Code', monospace" font-size="13" font-weight="600">whoami</text>
    <text x="76" y="14" fill="#8b949e" font-family="'Fira Code', monospace" font-size="13">--brief</text>

    <!-- Info Block -->
    <g transform="translate(0, 32)">
      <!-- Line 1: Identity -->
      <text x="0" y="0" fill="#ff7700" font-family="'Fira Code', monospace" font-size="12" font-weight="600">IDENTITY</text>
      <text x="78" y="0" fill="#484f58" font-family="'Fira Code', monospace" font-size="12">::</text>
      <text x="96" y="0" fill="#e6edf3" font-family="'Fira Code', monospace" font-size="12" font-weight="500">Ahmed (Torch)</text>
      <text x="212" y="0" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">// JordanSec CTF Team</text>

      <!-- Line 2: Focus -->
      <text x="0" y="21" fill="#ff7700" font-family="'Fira Code', monospace" font-size="12" font-weight="600">FOCUS</text>
      <text x="78" y="21" fill="#484f58" font-family="'Fira Code', monospace" font-size="12">::</text>
      <text x="96" y="21" fill="#79c0ff" font-family="'Fira Code', monospace" font-size="12">Web Exploitation</text>
      <text x="236" y="21" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">&#183;</text>
      <text x="250" y="21" fill="#7ee787" font-family="'Fira Code', monospace" font-size="12">OSINT</text>
      <text x="296" y="21" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">&#183;</text>
      <text x="310" y="21" fill="#d2a8ff" font-family="'Fira Code', monospace" font-size="12">Linux Systems &amp; Containers</text>

      <!-- Line 3: Tooling -->
      <text x="0" y="42" fill="#ff7700" font-family="'Fira Code', monospace" font-size="12" font-weight="600">STACK</text>
      <text x="78" y="42" fill="#484f58" font-family="'Fira Code', monospace" font-size="12">::</text>
      <text x="96" y="42" fill="#c9d1d9" font-family="'Fira Code', monospace" font-size="12">Python &#183; C/C++ &#183; systemd-nspawn &#183; GTK4 &#183; Burp Pro</text>

      <!-- Line 4: Achievement highlight -->
      <text x="0" y="63" fill="#ff7700" font-family="'Fira Code', monospace" font-size="12" font-weight="600">STATUS</text>
      <text x="78" y="63" fill="#484f58" font-family="'Fira Code', monospace" font-size="12">::</text>
      <text x="96" y="63" fill="#ffa657" font-family="'Fira Code', monospace" font-size="12" font-weight="600">National AI Champions (Jordan)</text>
      <text x="330" y="63" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">| #1 Crypteranet | #1 KaliTeam</text>
    </g>

    <!-- Prompt cursor at bottom -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#22c55e" font-family="'Fira Code', monospace" font-size="12" font-weight="600">t0rch.xyz</text>
      <text x="72" y="0" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">on</text>
      <text x="92" y="0" fill="#ff7700" font-family="'Fira Code', monospace" font-size="12">main</text>
      <text x="126" y="0" fill="#8b949e" font-family="'Fira Code', monospace" font-size="12">[!] ready</text>
      <rect x="194" y="-10" width="7" height="13" fill="#ff7700" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>